[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-assistant"
version = "0.2.0"
description = "An evidence-first incident investigation learning lab"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
incident-assistant = "incident_assistant.__main__:main"

[tool.setuptools.packages.find]
include = ["incident_assistant*"]
